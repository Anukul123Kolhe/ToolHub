<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ToolHub — AI-Powered, Privacy-First, All-in-One Online Utility Platform. Fast, client-side, zero-upload tools." />
    <title>ToolHub — AI-Powered, Privacy-First Online Utilities</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var isDevHtml = document.querySelector('script[src*="main.tsx"]');
          if (isDevHtml) {
            var base = window.location.pathname.replace(/\/+$/, '');
            window.location.replace(base + '/docs/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
  </body>
</html>
