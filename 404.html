<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ToolHub - Redirecting...</title>
    <script>
      (function() {
        var path = window.location.pathname;
        if (window.location.hostname.endsWith('github.io')) {
          var repoMatch = path.match(/^(\/[^\/]+)/);
          var repo = repoMatch ? repoMatch[1] : '';
          var remaining = path.slice(repo.length);
          if (remaining.startsWith('/docs')) {
            // Already inside /docs, let HashRouter handle it
            window.location.replace(repo + '/docs/#' + remaining.replace(/^\/docs\/?/, '/') + window.location.search + window.location.hash);
          } else {
            window.location.replace(repo + '/docs/#' + remaining + window.location.search + window.location.hash);
          }
        } else {
          window.location.replace('/#' + path + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./docs/">ToolHub</a>...</p>
  </body>
</html>
